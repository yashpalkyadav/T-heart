<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyCycle — Learn More. Waste Less.</title>

<meta name="description"
content="StudyCycle is a student-focused circular marketplace for educational resources. Buy, sell, exchange and donate books and study materials.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* =========================================================
   DESIGN SYSTEM
========================================================= */

:root {
    --green:#176b45;
    --green-dark:#0d4930;
    --green-light:#eaf4ee;

    --red:#c93d32;
    --red-dark:#8f2922;
    --red-light:#f9e9e7;

    --yellow:#e6b63b;
    --yellow-dark:#a77b11;
    --yellow-light:#fbf4dc;

    --black:#101512;
    --ink:#1b211d;
    --muted:#69736d;

    --paper:#f7f7f3;
    --white:#ffffff;
    --line:#e2e6e2;

    --radius:18px;
    --shadow:0 18px 50px rgba(16,21,18,.08);
}

/* =========================================================
   RESET
========================================================= */

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html {
    scroll-behavior:smooth;
}

body {
    font-family:"DM Sans",sans-serif;
    color:var(--ink);
    background:var(--paper);
    line-height:1.6;
    overflow-x:hidden;
}

img {
    max-width:100%;
    display:block;
}

a {
    text-decoration:none;
    color:inherit;
}

button {
    font:inherit;
}

.container {
    width:min(1180px, calc(100% - 40px));
    margin:auto;
}

.display {
    font-family:"Manrope",sans-serif;
}

.upper {
    text-transform:uppercase;
    letter-spacing:.16em;
    font-size:11px;
    font-weight:800;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    transition:.3s ease;
}

.header.scrolled {
    background:rgba(247,247,243,.94);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
}

.nav {
    height:82px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo {
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-mark {
    width:42px;
    height:42px;
    background:var(--green);
    color:white;
    display:grid;
    place-items:center;
    border-radius:11px;
    font-size:17px;
}

.logo-name {
    font-family:"Manrope";
    font-size:18px;
    font-weight:800;
    letter-spacing:-.04em;
}

.logo-sub {
    display:block;
    color:var(--red);
    font-size:9px;
    letter-spacing:.2em;
    font-weight:800;
    margin-top:-2px;
}

.nav-links {
    display:flex;
    align-items:center;
    gap:30px;
    font-size:13px;
    font-weight:700;
    color:#59625d;
}

.nav-links a {
    transition:.2s;
}

.nav-links a:hover {
    color:var(--green);
}

.nav-action {
    display:flex;
    align-items:center;
    gap:10px;
}

.btn {
    border:0;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:12px 18px;
    border-radius:10px;
    font-size:13px;
    font-weight:800;
    transition:.25s ease;
}

.btn-dark {
    background:var(--black);
    color:white;
}

.btn-dark:hover {
    background:var(--green);
    transform:translateY(-2px);
}

.btn-green {
    background:var(--green);
    color:white;
}

.btn-green:hover {
    background:var(--green-dark);
    transform:translateY(-2px);
}

.btn-outline {
    border:1px solid var(--line);
    background:white;
}

.btn-outline:hover {
    border-color:var(--green);
    color:var(--green);
}

.menu-button {
    display:none;
    width:42px;
    height:42px;
    border:1px solid var(--line);
    background:white;
    border-radius:10px;
    cursor:pointer;
}

/* =========================================================
   HERO
========================================================= */

.hero {
    min-height:850px;
    padding:155px 0 100px;
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(90deg,#f7f7f3 0%,#f7f7f3 58%,#edf3ee 58%,#edf3ee 100%);
}

.hero::after {
    content:"";
    position:absolute;
    right:-120px;
    bottom:-180px;
    width:450px;
    height:450px;
    border-radius:50%;
    border:1px solid rgba(23,107,69,.14);
}

.hero-grid {
    display:grid;
    grid-template-columns:1.02fr .98fr;
    gap:75px;
    align-items:center;
}

.hero-kicker {
    display:inline-flex;
    align-items:center;
    gap:9px;
    color:var(--green);
    margin-bottom:25px;
}

.hero-kicker::before {
    content:"";
    width:25px;
    height:2px;
    background:var(--red);
}

.hero h1 {
    font-family:"Manrope";
    font-size:clamp(50px,6vw,82px);
    line-height:.98;
    letter-spacing:-.065em;
    max-width:750px;
    color:var(--black);
}

.hero h1 span {
    color:var(--green);
}

.hero-copy {
    max-width:610px;
    color:#626c66;
    font-size:17px;
    line-height:1.8;
    margin-top:27px;
}

.hero-buttons {
    display:flex;
    gap:12px;
    margin-top:34px;
}

.hero-note {
    display:flex;
    gap:25px;
    margin-top:35px;
    font-size:12px;
    color:#727b76;
}

.hero-note span {
    display:flex;
    align-items:center;
    gap:7px;
}

.hero-note i {
    color:var(--green);
}

/* =========================================================
   PRODUCT PANEL
========================================================= */

.product-wrap {
    position:relative;
}

.product-card {
    background:white;
    border:1px solid #dce2dd;
    border-radius:20px;
    box-shadow:0 35px 80px rgba(19,38,28,.14);
    overflow:hidden;
}

.product-top {
    height:52px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid var(--line);
}

.window-dots {
    display:flex;
    gap:5px;
}

.window-dots span {
    width:7px;
    height:7px;
    border-radius:50%;
    background:#cdd3ce;
}

.product-brand {
    font-size:9px;
    letter-spacing:.18em;
    font-weight:800;
    color:#8b938e;
}

.product-user {
    width:27px;
    height:27px;
    background:var(--green-light);
    color:var(--green);
    display:grid;
    place-items:center;
    border-radius:8px;
    font-size:10px;
}

.product-body {
    padding:24px;
}

.product-heading {
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.product-heading small {
    color:#8b938e;
    font-size:10px;
}

.product-heading h3 {
    font-family:"Manrope";
    font-size:21px;
    letter-spacing:-.04em;
}

.avatar {
    width:38px;
    height:38px;
    border-radius:50%;
    background:var(--yellow-light);
    color:var(--yellow-dark);
    display:grid;
    place-items:center;
}

.search {
    margin-top:19px;
    border:1px solid var(--line);
    background:#fafbf9;
    border-radius:10px;
    padding:12px;
    display:flex;
    align-items:center;
    gap:10px;
    color:#9aa19c;
    font-size:11px;
}

.category-grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin:18px 0 25px;
}

.category {
    padding:12px 5px;
    border:1px solid var(--line);
    border-radius:10px;
    text-align:center;
    background:#fff;
}

.category i {
    font-size:13px;
    margin-bottom:7px;
}

.category p {
    font-size:8px;
    font-weight:800;
}

.category:nth-child(1) i {
    color:var(--green);
}

.category:nth-child(2) i {
    color:var(--red);
}

.category:nth-child(3) i {
    color:var(--yellow-dark);
}

.category:nth-child(4) i {
    color:#55746b;
}

.section-head {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.section-head strong {
    font-size:11px;
}

.section-head span {
    font-size:9px;
    color:var(--green);
    font-weight:800;
}

.resource {
    display:flex;
    align-items:center;
    gap:11px;
    padding:11px;
    border:1px solid var(--line);
    border-radius:11px;
    margin-top:8px;
}

.resource-icon {
    width:38px;
    height:38px;
    border-radius:8px;
    display:grid;
    place-items:center;
}

.resource:nth-child(2) .resource-icon {
    background:var(--red-light);
    color:var(--red);
}

.resource:nth-child(3) .resource-icon {
    background:var(--green-light);
    color:var(--green);
}

.resource-info {
    flex:1;
}

.resource-info strong {
    display:block;
    font-size:10px;
}

.resource-info span {
    display:block;
    font-size:8px;
    color:#909892;
    margin-top:2px;
}

.resource-price {
    font-size:10px;
    font-weight:800;
}

.product-footer {
    background:var(--black);
    color:white;
    padding:13px 20px;
    display:flex;
    justify-content:space-between;
    font-size:9px;
}

.product-footer span:last-child {
    color:#77c397;
    font-weight:800;
}

/* floating information */

.float-card {
    position:absolute;
    background:white;
    border:1px solid var(--line);
    box-shadow:0 15px 35px rgba(20,30,24,.13);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    gap:10px;
    align-items:center;
}

.float-card.one {
    left:-42px;
    top:115px;
}

.float-card.two {
    right:-30px;
    bottom:80px;
}

.float-icon {
    width:34px;
    height:34px;
    border-radius:8px;
    display:grid;
    place-items:center;
}

.float-card.one .float-icon {
    background:var(--green-light);
    color:var(--green);
}

.float-card.two .float-icon {
    background:var(--yellow-light);
    color:var(--yellow-dark);
}

.float-text small {
    display:block;
    font-size:8px;
    color:#89928d;
    font-weight:800;
}

.float-text strong {
    font-size:11px;
    display:block;
}

/* =========================================================
   SECTION COMMON
========================================================= */

.section {
    padding:115px 0;
}

.section-white {
    background:white;
}

.section-paper {
    background:var(--paper);
}

.section-dark {
    background:var(--black);
    color:white;
}

.section-label {
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--green);
    margin-bottom:18px;
}

.section-dark .section-label {
    color:#73bd92;
}

.section-label::before {
    content:"";
    width:24px;
    height:2px;
    background:var(--red);
}

.section-title {
    font-family:"Manrope";
    font-size:clamp(38px,4.2vw,58px);
    line-height:1.05;
    letter-spacing:-.055em;
    max-width:750px;
}

.section-description {
    color:var(--muted);
    max-width:620px;
    line-height:1.8;
    margin-top:20px;
}

.section-dark .section-description {
    color:#aab4ae;
}

/* =========================================================
   PROBLEM
========================================================= */

.problem-intro {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:80px;
    align-items:end;
}

.problem-grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:var(--line);
    margin-top:65px;
    border:1px solid var(--line);
}

.problem-card {
    background:white;
    padding:30px;
    min-height:245px;
}

.problem-number {
    font-size:11px;
    font-weight:800;
    color:var(--red);
}

.problem-icon {
    margin:35px 0 22px;
    font-size:20px;
}

.problem-card h3 {
    font-family:"Manrope";
    font-size:18px;
    letter-spacing:-.03em;
}

.problem-card p {
    font-size:13px;
    color:var(--muted);
    line-height:1.7;
    margin-top:9px;
}

/* =========================================================
   SOLUTION
========================================================= */

.solution-grid {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
    margin-top:60px;
}

.solution-card {
    border:1px solid var(--line);
    border-radius:18px;
    padding:32px;
    min-height:270px;
    position:relative;
    overflow:hidden;
    transition:.3s;
}

.solution-card:hover {
    transform:translateY(-5px);
    box-shadow:var(--shadow);
}

.solution-card:nth-child(1) {
    border-top:3px solid var(--green);
}

.solution-card:nth-child(2) {
    border-top:3px solid var(--red);
}

.solution-card:nth-child(3) {
    border-top:3px solid var(--yellow);
}

.solution-card:nth-child(4) {
    border-top:3px solid #486b60;
}

.solution-icon {
    width:48px;
    height:48px;
    border-radius:12px;
    display:grid;
    place-items:center;
    background:#f2f4f1;
    margin-bottom:28px;
}

.solution-card:nth-child(1) .solution-icon {
    color:var(--green);
}

.solution-card:nth-child(2) .solution-icon {
    color:var(--red);
}

.solution-card:nth-child(3) .solution-icon {
    color:var(--yellow-dark);
}

.solution-card:nth-child(4) .solution-icon {
    color:#486b60;
}

.solution-card h3 {
    font-family:"Manrope";
    font-size:22px;
    letter-spacing:-.04em;
}

.solution-card p {
    font-size:13px;
    color:var(--muted);
    line-height:1.8;
    max-width:480px;
    margin-top:10px;
}

/* =========================================================
   HOW IT WORKS
========================================================= */

.workflow {
    margin-top:60px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    border-top:1px solid #38403b;
    border-bottom:1px solid #38403b;
}

.workflow-item {
    padding:30px 23px;
    border-right:1px solid #38403b;
    min-height:250px;
}

.workflow-item:last-child {
    border-right:0;
}

.workflow-num {
    font-size:10px;
    color:#72bd91;
    font-weight:800;
}

.workflow-item h3 {
    font-family:"Manrope";
    font-size:18px;
    margin-top:45px;
}

.workflow-item p {
    color:#929d96;
    font-size:12px;
    line-height:1.7;
    margin-top:10px;
}

.workflow-item:last-child {
    background:#153b29;
}

/* =========================================================
   BUSINESS
========================================================= */

.business-layout {
    display:grid;
    grid-template-columns:.9fr 1.1fr;
    gap:80px;
    align-items:start;
}

.revenue-list {
    margin-top:45px;
}

.revenue {
    display:grid;
    grid-template-columns:48px 1fr;
    gap:18px;
    padding:20px 0;
    border-bottom:1px solid var(--line);
}

.revenue-icon {
    width:42px;
    height:42px;
    border-radius:10px;
    background:var(--green-light);
    color:var(--green);
    display:grid;
    place-items:center;
}

.revenue h3 {
    font-family:"Manrope";
    font-size:16px;
}

.revenue p {
    font-size:12px;
    color:var(--muted);
    margin-top:5px;
}

.unit-card {
    background:var(--black);
    color:white;
    border-radius:20px;
    padding:35px;
    position:relative;
    overflow:hidden;
}

.unit-card::after {
    content:"";
    position:absolute;
    width:240px;
    height:240px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:50%;
    right:-80px;
    top:-80px;
}

.unit-top {
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #303833;
    padding-bottom:22px;
}

.unit-top span {
    color:#87928b;
    font-size:10px;
}

.unit-top strong {
    color:#76bd92;
    font-size:10px;
}

.unit-row {
    display:flex;
    justify-content:space-between;
    padding:18px 0;
    border-bottom:1px solid #303833;
    font-size:13px;
}

.unit-row span {
    color:#9ca59f;
}

.unit-result {
    margin-top:25px;
    padding:20px;
    background:#153b29;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.unit-result small {
    display:block;
    color:#94ad9e;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.12em;
}

.unit-result strong {
    font-family:"Manrope";
    color:#7ed09b;
    font-size:27px;
}

/* =========================================================
   VALIDATION
========================================================= */

.validation-head {
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:40px;
}

.validation-grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-top:55px;
}

.validation-card {
    background:white;
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px;
}

.validation-card:nth-child(1) {
    border-top:3px solid var(--green);
}

.validation-card:nth-child(2) {
    border-top:3px solid var(--yellow);
}

.validation-card:nth-child(3) {
    border-top:3px solid var(--red);
}

.validation-question {
    font-family:"Manrope";
    font-size:16px;
    line-height:1.35;
    margin:18px 0 28px;
}

.metric {
    display:flex;
    justify-content:space-between;
    align-items:end;
}

.metric strong {
    font-family:"Manrope";
    font-size:38px;
    letter-spacing:-.06em;
}

.metric span {
    font-size:10px;
    color:#89928d;
}

.bar {
    height:6px;
    background:#e8ebe8;
    border-radius:99px;
    margin-top:12px;
    overflow:hidden;
}

.bar div {
    height:100%;
    border-radius:99px;
    width:0;
    transition:1.2s ease;
}

.validation-card:nth-child(1) .bar div {
    background:var(--green);
}

.validation-card:nth-child(2) .bar div {
    background:var(--yellow);
}

.validation-card:nth-child(3) .bar div {
    background:var(--red);
}

.validation-note {
    font-size:10px;
    color:#8b938e;
    margin-top:35px;
}

/* =========================================================
   IMPACT STATEMENT
========================================================= */

.impact {
    background:var(--green);
    color:white;
    padding:90px 0;
    position:relative;
    overflow:hidden;
}

.impact::before {
    content:"02";
    position:absolute;
    right:4%;
    top:-75px;
    font-family:"Manrope";
    font-size:260px;
    font-weight:800;
    color:rgba(255,255,255,.045);
}

.impact-layout {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:80px;
    align-items:center;
}

.impact h2 {
    font-family:"Manrope";
    font-size:clamp(42px,5vw,67px);
    line-height:1;
    letter-spacing:-.06em;
}

.impact p {
    color:#d0e2d7;
    line-height:1.8;
}

.impact-stats {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:1px;
    background:rgba(255,255,255,.16);
}

.impact-stat {
    padding:28px;
    background:var(--green);
}

.impact-stat strong {
    font-family:"Manrope";
    font-size:38px;
}

.impact-stat span {
    display:block;
    color:#c6dfcf;
    font-size:11px;
    margin-top:5px;
}

/* =========================================================
   ROADMAP
========================================================= */

.roadmap {
    margin-top:60px;
    position:relative;
}

.roadmap-line {
    position:absolute;
    top:23px;
    left:5%;
    right:5%;
    height:1px;
    background:var(--line);
}

.roadmap-grid {
    display:grid;
    grid-template-columns:repeat(5,1fr);
    position:relative;
}

.phase {
    padding:0 14px;
}

.phase-dot {
    width:46px;
    height:46px;
    border-radius:50%;
    background:white;
    border:2px solid var(--green);
    color:var(--green);
    display:grid;
    place-items:center;
    margin:auto;
    font-size:11px;
    font-weight:800;
    position:relative;
}

.phase.active .phase-dot {
    background:var(--green);
    color:white;
}

.phase h3 {
    font-family:"Manrope";
    text-align:center;
    margin-top:20px;
    font-size:15px;
}

.phase p {
    text-align:center;
    color:var(--muted);
    font-size:11px;
    line-height:1.6;
    margin-top:8px;
}
